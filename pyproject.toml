[project]
name = "news-agent"
# The single source of truth for the version. `core.provenance` reads it from
# the installed package metadata rather than restating it — two version numbers
# that can disagree is the same duplicate-field problem we pruned out of the
# telemetry, and the traces would have been the ones to lie.
version = "0.3.0"
description = "A minimal Claude agent that reads the news via a custom RSS tool."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.69",
    "pydantic>=2.7",
]

[project.optional-dependencies]
tracing = ["langfuse>=3.0"]
dev = ["pytest>=8.0"]

[project.scripts]
news-agent = "news_agent.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
